<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="yo-eats.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,500;1,600&display=swap" rel="stylesheet">
    <title>Yo Eats</title>
</head>

<body>

    <div class="sidebar">
        <!-- logo -->
        <h1 class="logo">Yo! Eats</h1>
        <img src="yo !! eats png" alt="Yo Eats Logo">
        <!-- menu -->
        <div class="sidebar-menus">
            <a href='#'><ion-icon name="storefront-outline"></ion-icon>Home</a>
            <a href='#'><ion-icon name="receipt-outline"></ion-icon>Receipt</a>
            <a href="burger.html#Reservation"><ion-icon name="restaurant-outline"></ion-icon>Reservation</a>
            <a href='#'><ion-icon name="notifications-outline"></ion-icon>Notification</a>
            <a href='about us.html'><ion-icon name="chatbubble-outline"></ion-icon>Contact us</a>
            <a href='settings.html'><ion-icon name="settings-outline"></ion-icon>Settings</a>
        </div>
        <!-- Logout Section -->
        <div class="sidebar-logout">
            <a href='#'><ion-icon name="log-out-outline"></ion-icon>Logout</a>
        </div>
    </div>

    <div class="main">
        <!-- main navbar -->
        <div class="main-navbar">
            <!-- menu when appearing on mobile (consider visibility for mobile) -->
            <ion-icon class="menu-toggle" name="menu-outline"></ion-icon>
            <!-- search bar -->
            <div class="search">
                <input type="text" id="searchInput" placeholder="Search for a dish or cuisine...">
                <button class="search-btn">Search</button>
            </div>
            <!-- profile icon on the left -->
            <div class="profile">
                <a class="cart" href='cart.html'><ion-icon name="cart"></ion-icon><span id="cart-count"></span></a>

                <a class="user" href='#'><ion-icon name="person-outline"></ion-icon></a>
                
            </div>
        </div>
        <!-- main highlights -->
        <div class="main-highlight">
            <!-- title section and arrow -->
            <div class="main-header">
                <h2 class="main-title">Today's Special</h2>
                <div class="main-arrow">
                    <ion-icon class="back" name="chevron-back-circle-outline"></ion-icon>
                    <ion-icon class="next" name="chevron-forward-circle-outline"></ion-icon>
                </div>
            </div>
            <!-- highlight wrapper and cards -->
            <div class="highlight-wrapper">
                <!-- Highlight 1 -->
                <div class="highlight-card">
                    <img class="highlight-img" src="background.jpg" alt="Biryani Image">
                    <div class="highlight-desc">
                        <h4>Biryani</h4>
                        <p>Rs:149</p>
                    </div>
                </div>
                <!-- Highlight 2 -->
                <div class="highlight-card">
                    <img class="highlight-img" src="Pizza.jpg" alt="Pizza Image">
                    <div class="highlight-desc">
                        <h4>Pizza</h4>
                        <p>Rs:179</p>
                    </div>
                </div>
                <!-- Highlight 3 -->
                <div class="highlight-card">
                    <img class="highlight-img" src="mango lassi.jpg" alt="Mango Lassi Image">
                    <div class="highlight-desc">
                        <h4>Mango Lassi</h4>
                        <p>Rs:69</p>
                    </div>
                </div>
                <!-- Highlight 4 -->
                <div class="highlight-card">
                    <img class="highlight-img" src="do" alt="Masala Dosa Image">
                    <div class="highlight-desc">
                        <h4>Masala Dosa</h4>
                        <p>Rs:45</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- main menus -->
        <div class="main-menus">
            <!-- filter section -->
            <div class="main-filter">
                <div>
                    <h2 class="main-title">Menu <br>Category</h2>
                    <div class="main-arrow">
                        <ion-icon class="back-menus" name="chevron-back-circle-outline"></ion-icon>
                        <ion-icon class="next-menus" name="chevron-forward-circle-outline"></ion-icon>
                    </div>
                </div>
                <div class="filter-wrapper">
                    <!-- Filter 1 -->
                    <a href="burger.html#burger" class="filter-cart">
                        <div class="filter-icon">
                            <ion-icon name="fast-food-outline"></ion-icon>
                        </div>
                        <p>Burger</p>
                    </a>
                    <!-- Filter 2 -->
                    <a href="burger.html#pizza-section" class="filter-cart">
                        <div class="filter-icon">
                            <ion-icon name="pizza-outline"></ion-icon>
                        </div>
                        <p>Pizza</p>
                    </a>
                    <!-- Filter 3 -->
                    <a href="burger.html#ice-cream-section" class="filter-cart">
                        <div class="filter-icon">
                            <ion-icon name="ice-cream-outline"></ion-icon>
                        </div>
                        <p>Ice-Cream</p>
                    </a>
                    <!-- Filter 4 -->
                    <a href="burger.html#fruits-section" class="filter-cart">
                        <div class="filter-icon">
                            <ion-icon name="nutrition-outline"></ion-icon>
                        </div>
                        <p>Fruits</p>
                    </a>
                    <!-- Filter 5 -->
                    <a href="burger.html#coffie-section" class="filter-cart">
                        <div class="filter-icon">
                            <ion-icon name="cafe-outline"></ion-icon>
                        </div>
                        <p>Coffee</p>
                    </a>
                    <!-- Filter 6 -->
                    <a href="seafood-page.html" class="filter-cart">
                        <div class="filter-icon">
                            <ion-icon name="fish-outline"></ion-icon>
                        </div>
                        <p>Seafood</p>
                    </a>
                </div>
            </div>
            <hr class="divider">
            <!-- list of food menus-->
            <div class="main-detail">
                <h2 class="main-title">Choose Order</h2>
                <div class="detail-wrapper" id="menu-container">
                    <!-- Menu items will be injected here dynamically by app.js -->
                </div>
            </div>
        </div>
    </div>
                    

</body>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<!-- Adding JavaScript -->
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
<script src="app.js"></script>
<script src="cart.js"></script>
</body>

</html>
