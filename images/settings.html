<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="settings.css">
  <title>Website Settings</title>
</head>
<body>
  <div class="container">
    <h1>Website Settings</h1>
    <div class="setting">
      <label for="theme">Theme:</label>
      <select id="theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
    <div class="setting">
      <label for="language">Language:</label>
      <select id="language">
        <option value="en">English</option>
        <option value="fr">French</option>
        <!-- Add more language options as needed -->
      </select>
    </div>
    <div class="setting">
      <label for="textSize">Text Size:</label>
      <input type="range" id="textSize" min="10" max="30" value="16">
    </div>
    <div class="setting">
      <label for="mobileView">Mobile View:</label>
      <input type="checkbox" id="mobileView">
    </div>
    <div class="setting">
      <label for="accountDetails">Account Details:</label>
      <input type="checkbox" id="accountDetails">
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
